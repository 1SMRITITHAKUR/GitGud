name: Process Submissions Images

on:
  push:
    paths:
      - 'submissions/**'

jobs:
  process_images:
    runs-on: ubuntu-latest
    steps:
      - name: Process mmemees
        run: |
          curl -X POST ${{ secrets.API_URL }}/image/set \
            -H "Content-Type: application/json" \
            -d '{"password": "${{ secrets.API_PASSWORD }}", "repo": "${{ github.repository }}"}'
